map $http_upgrade $metabase_connection_upgrade {
  default upgrade;
  '' close;
}

limit_req_zone $binary_remote_addr zone=metabase_reports_ip:16m rate=120r/m;

server {
  listen 443 ssl;
  http2 on;
  include resty-server-https.conf;
  server_name reports.jobfynder.com;

  client_max_body_size 20m;
  client_header_buffer_size 32k;
  large_client_header_buffers 4 64k;

  include /usr/local/openresty/nginx/conf/error-pages.conf;

  location / {
    limit_req zone=metabase_reports_ip burst=60 nodelay;

    proxy_http_version 1.1;
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_pass http://172.17.0.1:8787;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $metabase_connection_upgrade;

    proxy_hide_header X-Powered-By;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }
}

