name: Deploy to Elestio

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Plan shows changes only; apply performs the deployment
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
      expected_hostname:
        description: Confirm the production EspoCRM hostname
        required: true
        type: string
      backup_snapshot_reference:
        description: Elestio snapshot/backup identifier created immediately before deployment
        required: false
        type: string
      production_confirmation:
        description: Enter BACKUP-CONFIRMED for apply mode
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: elestio-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6

      - name: Verify deployment target
        env:
          EXPECTED_HOSTNAME: ${{ vars.ESPOCRM_PRODUCTION_HOSTNAME }}
          CONFIRMED_HOSTNAME: ${{ inputs.expected_hostname }}
          DEPLOYMENT_MODE: ${{ inputs.mode }}
          BACKUP_REFERENCE: ${{ inputs.backup_snapshot_reference }}
          PRODUCTION_CONFIRMATION: ${{ inputs.production_confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPECTED_HOSTNAME"
          test "$CONFIRMED_HOSTNAME" = "$EXPECTED_HOSTNAME"
          if [ "$DEPLOYMENT_MODE" = "apply" ]; then
            test -n "$BACKUP_REFERENCE"
            test "$PRODUCTION_CONFIRMATION" = "BACKUP-CONFIRMED"
          fi

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ELESTIO_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.ELESTIO_HOST }}
          SSH_PORT: ${{ secrets.ELESTIO_SSH_PORT || '22' }}
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/elestio
          chmod 600 ~/.ssh/elestio
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Preview customization changes
        env:
          SSH_HOST: ${{ secrets.ELESTIO_HOST }}
          SSH_USER: ${{ secrets.ELESTIO_SSH_USER }}
          SSH_PORT: ${{ secrets.ELESTIO_SSH_PORT || '22' }}
          STACK_PATH: ${{ secrets.ELESTIO_STACK_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STACK_PATH"
          rsync -azn --delete --itemize-changes --omit-dir-times --no-owner --no-group --exclude='.gitkeep' \
            -e "ssh -i ~/.ssh/elestio -p $SSH_PORT" \
            custom/ "$SSH_USER@$SSH_HOST:$STACK_PATH/espocrm/custom/"
          rsync -azn --delete --itemize-changes --omit-dir-times --no-owner --no-group --exclude='.gitkeep' \
            -e "ssh -i ~/.ssh/elestio -p $SSH_PORT" \
            client/custom/ "$SSH_USER@$SSH_HOST:$STACK_PATH/espocrm/client-custom/"

      - name: Apply customization changes
        if: ${{ inputs.mode == 'apply' }}
        env:
          SSH_HOST: ${{ secrets.ELESTIO_HOST }}
          SSH_USER: ${{ secrets.ELESTIO_SSH_USER }}
          SSH_PORT: ${{ secrets.ELESTIO_SSH_PORT || '22' }}
          STACK_PATH: ${{ secrets.ELESTIO_STACK_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/elestio -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "test -f '$STACK_PATH/.benchteq-managed'"
          rsync -az --delete --omit-dir-times --no-owner --no-group --exclude='.gitkeep' \
            -e "ssh -i ~/.ssh/elestio -p $SSH_PORT" \
            custom/ "$SSH_USER@$SSH_HOST:$STACK_PATH/espocrm/custom/"
          rsync -az --delete --omit-dir-times --no-owner --no-group --exclude='.gitkeep' \
            -e "ssh -i ~/.ssh/elestio -p $SSH_PORT" \
            client/custom/ "$SSH_USER@$SSH_HOST:$STACK_PATH/espocrm/client-custom/"
          ssh -i ~/.ssh/elestio -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "chown -R www-data:www-data '$STACK_PATH/espocrm/custom' '$STACK_PATH/espocrm/client-custom'"

      - name: Rebuild EspoCRM
        if: ${{ inputs.mode == 'apply' }}
        env:
          SSH_HOST: ${{ secrets.ELESTIO_HOST }}
          SSH_USER: ${{ secrets.ELESTIO_SSH_USER }}
          SSH_PORT: ${{ secrets.ELESTIO_SSH_PORT || '22' }}
          STACK_PATH: ${{ secrets.ELESTIO_STACK_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/elestio -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd '$STACK_PATH' && docker compose exec -T espocrm php command.php rebuild"

      - name: Verify EspoCRM health
        env:
          SSH_HOST: ${{ secrets.ELESTIO_HOST }}
          SSH_USER: ${{ secrets.ELESTIO_SSH_USER }}
          SSH_PORT: ${{ secrets.ELESTIO_SSH_PORT || '22' }}
          STACK_PATH: ${{ secrets.ELESTIO_STACK_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/elestio -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd '$STACK_PATH' && docker compose exec -T espocrm php bin/command app-check"
