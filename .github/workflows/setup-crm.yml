name: Setup CRM

# Runs scripts/setup-roles-dashboards.py against production through the EspoCRM API:
# roles, menu, dashboard, currency, time zone, and optional role assignment.
# Safe to run again. Start with dry_run on (the default).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Show what would change without changing anything
        required: true
        default: true
        type: boolean
      assign:
        description: 'Give users a role. Comma separated, for example: priya=Coordinator,rahul=Finance,amit=Interview Manager'
        required: false
        type: string
      reset_user_dashboards:
        description: Replace every user's personal dashboard with the default
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: crm-setup-production
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6

      - name: Run setup script
        env:
          ESPO_URL: ${{ secrets.ESPO_URL }}
          ESPO_USER: ${{ secrets.ESPO_USER }}
          ESPO_PASSWORD: ${{ secrets.ESPO_PASSWORD }}
          EXPECTED_HOSTNAME: ${{ vars.ESPOCRM_PRODUCTION_HOSTNAME }}
          DRY_RUN: ${{ inputs.dry_run }}
          ASSIGN: ${{ inputs.assign }}
          RESET_DASHBOARDS: ${{ inputs.reset_user_dashboards }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ESPO_URL" && test -n "$ESPO_USER" && test -n "$ESPO_PASSWORD"
          test -n "$EXPECTED_HOSTNAME"
          # Accept the address with or without https:// and a trailing slash.
          # The host itself must still match exactly.
          norm() { printf '%s' "$1" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]' | sed -E 's#^https?://##; s#/+$##'; }
          url_host="$(norm "$ESPO_URL")"
          expected_host="$(norm "$EXPECTED_HOSTNAME")"
          if [ "$url_host" != "$expected_host" ]; then
            echo "ESPO_URL does not match the production hostname"
            echo "Hint: the hostname setting should be the host only, and ESPO_URL the same host (optionally with https://)."
            exit 1
          fi
          export ESPO_URL="https://$url_host"
          args=()
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          [ "$RESET_DASHBOARDS" = "true" ] && args+=(--reset-user-dashboards)
          if [ -n "$ASSIGN" ]; then
            IFS=',' read -ra items <<< "$ASSIGN"
            for item in "${items[@]}"; do
              item="$(echo "$item" | sed 's/^ *//;s/ *$//')"
              [ -n "$item" ] && args+=(--assign "$item")
            done
          fi
          python3 scripts/setup-roles-dashboards.py "${args[@]}"
